# Observability plan, Phase 1: JSON access log for every proxy host.
# Installed by playbooks/networking/gateway-logging-setup.yml as
# /data/nginx/custom/http_top.conf (included at the top of NPM's http block).

map $status $tfd_level {
    ~^5     "error";
    ~^4     "warn";
    default "info";
}

# Behind Cloudflare the TCP peer is the tunnel; the visitor is in CF-Connecting-IP.
map $http_cf_connecting_ip $tfd_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# One JSON object per request. `cfRay` is the id a user or Cloudflare can quote and the one field
# this hop shares with the app logs (the request id is created later, at the ingress). `path` is
# $uri, which excludes the query string, so tokens never reach the log.
log_format tfd_json escape=json
    '{"ts":"$time_iso8601","level":"$tfd_level","app":"npm","type":"request",'
    '"cfRay":"$http_cf_ray","method":"$request_method","host":"$host","path":"$uri",'
    '"status":$status,"bytesOut":$body_bytes_sent,"requestTime":$request_time,'
    '"upstream":"$upstream_addr","upstreamStatus":"$upstream_status","upstreamTime":"$upstream_response_time",'
    '"ip":"$tfd_ip","country":"$http_cf_ipcountry","userAgent":"$http_user_agent"}';
