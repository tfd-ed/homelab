# promtool unit tests for alerts/slo.yml (generated by Sloth from slo/slos.sloth.yml). They prove the
# burn-rate alerts page on a sustained outage and stay quiet on a blip, and that the API SLIs count
# what they should (known routes, not synthetic journeys). Run from the prometheus directory:
#   docker run --rm --entrypoint promtool -v "$PWD:/w" prom/prometheus:v2.48.1 test rules /w/tests/slo.test.yml
rule_files:
  - ../alerts/slo.yml

evaluation_interval: 1m

tests:
  - name: a site that is down for over an hour pages and opens a ticket
    interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-http", probe="site", env="prod"}'
        values: '1x300 0x80'
    alert_rule_test:
      - eval_time: 360m
        alertname: SiteAvailabilitySloBurn
        exp_alerts:
          - exp_labels: {severity: critical, category: availability, env: prod, sloth_id: tfd-site-available, sloth_service: tfd, sloth_slo: site-available, sloth_severity: page}
            exp_annotations:
              summary: "The site is burning its availability budget"
              description: "The public site is failing its probe fast enough to use up the 30-day budget of 99.5 % availability early. Open the TFD Services dashboard and the Alerts page; HttpProbeFailed names the failing target."
              runbook: "homelab-journey/docs/monitoring-phase5.md#slos"
              title: "(page) tfd site-available SLO error budget burn rate is too fast."
          - exp_labels: {severity: warning, category: availability, env: prod, sloth_id: tfd-site-available, sloth_service: tfd, sloth_slo: site-available, sloth_severity: ticket}
            exp_annotations:
              summary: "The site is burning its availability budget"
              description: "The public site is failing its probe fast enough to use up the 30-day budget of 99.5 % availability early. Open the TFD Services dashboard and the Alerts page; HttpProbeFailed names the failing target."
              runbook: "homelab-journey/docs/monitoring-phase5.md#slos"
              title: "(ticket) tfd site-available SLO error budget burn rate is too fast."

  - name: a short outage after days of health does not page
    interval: 1m
    input_series:
      # 3 days and 3 hours healthy, 3 minutes down, then healthy again
      - series: 'probe_success{job="blackbox-http", probe="site", env="prod"}'
        values: '1x4500 0x3 1x10'
    alert_rule_test:
      - eval_time: 4512m
        alertname: SiteAvailabilitySloBurn
        exp_alerts: []

  - name: a healthy site never alerts and keeps its whole budget
    interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-http", probe="site", env="prod"}'
        values: '1x400'
    alert_rule_test:
      - eval_time: 399m
        alertname: SiteAvailabilitySloBurn
        exp_alerts: []
    promql_expr_test:
      - expr: 'slo:period_error_budget_remaining:ratio{sloth_slo="site-available"}'
        eval_time: 399m
        exp_samples:
          - labels: 'slo:period_error_budget_remaining:ratio{env="prod", sloth_id="tfd-site-available", sloth_service="tfd", sloth_slo="site-available", sloth_window="30d"}'
            value: 1

  - name: the dev site is not measured
    interval: 1m
    input_series:
      - series: 'probe_success{job="blackbox-http", probe="site", env="dev"}'
        values: '0x400'
    alert_rule_test:
      - eval_time: 399m
        alertname: SiteAvailabilitySloBurn
        exp_alerts: []

  - name: API availability counts known routes and leaves out synthetic journeys and unknown URLs
    interval: 1m
    input_series:
      - series: 'http_server_duration_seconds_count{job="tfd-api", env="prod", route="/x", status_class="2xx"}'
        values: '0+54x100'
      - series: 'http_server_duration_seconds_count{job="tfd-api", env="prod", route="/x", status_class="5xx"}'
        values: '0+6x100'
      # a journey that fails every request must not move the number
      - series: 'http_server_duration_seconds_count{job="tfd-api", env="prod", route="/x", status_class="5xx", traffic="synthetic"}'
        values: '0+30x100'
      # scanner noise on unknown URLs, all 404, many
      - series: 'http_server_duration_seconds_count{job="tfd-api", env="prod", route="unmatched", status_class="4xx"}'
        values: '0+900x100'
    promql_expr_test:
      - expr: 'round(slo:sli_error:ratio_rate5m{sloth_slo="api-available"}, 0.001)'
        eval_time: 70m
        exp_samples:
          - labels: '{env="prod", sloth_id="tfd-api-available", sloth_service="tfd", sloth_slo="api-available", sloth_window="5m"}'
            value: 0.1
    alert_rule_test:
      - eval_time: 70m
        alertname: ApiAvailabilitySloBurn
        exp_alerts:
          - exp_labels: {severity: critical, category: availability, env: prod, sloth_id: tfd-api-available, sloth_service: tfd, sloth_slo: api-available, sloth_severity: page}
            exp_annotations:
              summary: "The API is burning its availability budget"
              description: "Too many API responses are 5xx for the 30-day budget of 99.5 % to hold. Look at the Requests page filtered to 5xx, then the error issues in GlitchTip, then the traces."
              runbook: "homelab-journey/docs/monitoring-phase5.md#slos"
              title: "(page) tfd api-available SLO error budget burn rate is too fast."
          - exp_labels: {severity: warning, category: availability, env: prod, sloth_id: tfd-api-available, sloth_service: tfd, sloth_slo: api-available, sloth_severity: ticket}
            exp_annotations:
              summary: "The API is burning its availability budget"
              description: "Too many API responses are 5xx for the 30-day budget of 99.5 % to hold. Look at the Requests page filtered to 5xx, then the error issues in GlitchTip, then the traces."
              runbook: "homelab-journey/docs/monitoring-phase5.md#slos"
              title: "(ticket) tfd api-available SLO error budget burn rate is too fast."

  - name: slow API requests open a ticket long before they page
    interval: 1m
    input_series:
      # 60 requests a minute, 54 under 1 s: 10 % are slow, a 5 % allowance is burnt twice over
      - series: 'http_server_duration_seconds_count{job="tfd-api", env="prod", route="/x", status_class="2xx"}'
        values: '0+60x100'
      - series: 'http_server_duration_seconds_bucket{job="tfd-api", env="prod", route="/x", status_class="2xx", le="1"}'
        values: '0+54x100'
      - series: 'http_server_duration_seconds_bucket{job="tfd-api", env="prod", route="/x", status_class="2xx", le="+Inf"}'
        values: '0+60x100'
    promql_expr_test:
      - expr: 'round(slo:sli_error:ratio_rate1h{sloth_slo="api-fast"}, 0.001)'
        eval_time: 90m
        exp_samples:
          - labels: '{env="prod", sloth_id="tfd-api-fast", sloth_service="tfd", sloth_slo="api-fast", sloth_window="1h"}'
            value: 0.1
    alert_rule_test:
      # 10 % slow against a 5 % allowance is a burn of 2: it opens a ticket (1x over 6h and 3d) but is
      # nowhere near the 14.4x or 6x that page
      - eval_time: 90m
        alertname: ApiLatencySloBurn
        exp_alerts:
          - exp_labels: {severity: warning, category: latency, env: prod, sloth_id: tfd-api-fast, sloth_service: tfd, sloth_slo: api-fast, sloth_severity: ticket}
            exp_annotations:
              summary: "The API is burning its latency budget"
              description: "Too many API requests take over a second for the 30-day budget of 95 % under 1 s to hold. Check CPU throttling first (ContainerCpuThrottled), then the slowest routes on the Requests page; a slow request's exemplar opens its trace."
              runbook: "homelab-journey/docs/monitoring-phase5.md#slos"
              title: "(ticket) tfd api-fast SLO error budget burn rate is too fast."
