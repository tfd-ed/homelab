  rules:
  - record: slo:objective:ratio
    expr: vector(0.95)
    labels:
      env: prod
      sloth_id: tfd-api-fast
      sloth_service: tfd
      sloth_slo: api-fast
  - record: slo:error_budget:ratio
    expr: vector(1-0.95)
    labels:
      env: prod
      sloth_id: tfd-api-fast
      sloth_service: tfd
      sloth_slo: api-fast
  - record: slo:time_period:days
    expr: vector(30)
    labels:
      env: prod
      sloth_id: tfd-api-fast
      sloth_service: tfd
      sloth_slo: api-fast
  - record: slo:current_burn_rate:ratio
    expr: |
      slo:sli_error:ratio_rate5m{sloth_id="tfd-api-fast", sloth_service="tfd", sloth_slo="api-fast"}
      / on(sloth_id, sloth_slo, sloth_service) group_left
      slo:error_budget:ratio{sloth_id="tfd-api-fast", sloth_service="tfd", sloth_slo="api-fast"}
    labels:
      env: prod
      sloth_id: tfd-api-fast
      sloth_service: tfd
      sloth_slo: api-fast
  - record: slo:period_burn_rate:ratio
    expr: |
      slo:sli_error:ratio_rate30d{sloth_id="tfd-api-fast", sloth_service="tfd", sloth_slo="api-fast"}
      / on(sloth_id, sloth_slo, sloth_service) group_left
      slo:error_budget:ratio{sloth_id="tfd-api-fast", sloth_service="tfd", sloth_slo="api-fast"}
    labels:
      env: prod
      sloth_id: tfd-api-fast
      sloth_service: tfd
      sloth_slo: api-fast
  - record: slo:period_error_budget_remaining:ratio
    expr: 1 - slo:period_burn_rate:ratio{sloth_id="tfd-api-fast", sloth_service="tfd",
      sloth_slo="api-fast"}
    labels:
      env: prod
      sloth_id: tfd-api-fast
      sloth_service: tfd
      sloth_slo: api-fast
  - record: sloth_slo_info
    expr: vector(1)
    labels:
      env: prod
      sloth_id: tfd-api-fast
      sloth_mode: cli-gen-prom
      sloth_objective: "95"
      sloth_service: tfd
      sloth_slo: api-fast
      sloth_spec: prometheus/v1
      sloth_version: v0.11.0
- name: sloth-slo-alerts-tfd-api-fast
  rules:
  - alert: ApiLatencySloBurn
    expr: |
      (
          max(slo:sli_error:ratio_rate5m{sloth_id="tfd-api-fast", sloth_service="tfd", sloth_slo="api-fast"} > (14.4 * 0.05)) without (sloth_window)
          and
          max(slo:sli_error:ratio_rate1h{sloth_id="tfd-api-fast", sloth_service="tfd", sloth_slo="api-fast"} > (14.4 * 0.05)) without (sloth_window)
      )
      or
      (
          max(slo:sli_error:ratio_rate30m{sloth_id="tfd-api-fast", sloth_service="tfd", sloth_slo="api-fast"} > (6 * 0.05)) without (sloth_window)
          and
          max(slo:sli_error:ratio_rate6h{sloth_id="tfd-api-fast", sloth_service="tfd", sloth_slo="api-fast"} > (6 * 0.05)) without (sloth_window)
      )
    labels:
      category: latency
      severity: critical
      sloth_severity: page
    annotations:
      description: Too many API requests take over a second for the 30-day budget
        of 95 % under 1 s to hold. Check CPU throttling first (ContainerCpuThrottled),
        then the slowest routes on the Requests page; a slow request's exemplar opens
        its trace.
      runbook: homelab-journey/docs/monitoring-phase5.md#slos
      summary: The API is burning its latency budget
      title: (page) {{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget
        burn rate is too fast.
  - alert: ApiLatencySloBurn
    expr: |
      (
          max(slo:sli_error:ratio_rate2h{sloth_id="tfd-api-fast", sloth_service="tfd", sloth_slo="api-fast"} > (3 * 0.05)) without (sloth_window)
          and
          max(slo:sli_error:ratio_rate1d{sloth_id="tfd-api-fast", sloth_service="tfd", sloth_slo="api-fast"} > (3 * 0.05)) without (sloth_window)
      )
      or
      (
          max(slo:sli_error:ratio_rate6h{sloth_id="tfd-api-fast", sloth_service="tfd", sloth_slo="api-fast"} > (1 * 0.05)) without (sloth_window)
          and
          max(slo:sli_error:ratio_rate3d{sloth_id="tfd-api-fast", sloth_service="tfd", sloth_slo="api-fast"} > (1 * 0.05)) without (sloth_window)
      )
    labels:
      category: latency
      severity: warning
      sloth_severity: ticket
    annotations:
      description: Too many API requests take over a second for the 30-day budget
        of 95 % under 1 s to hold. Check CPU throttling first (ContainerCpuThrottled),
        then the slowest routes on the Requests page; a slow request's exemplar opens
        its trace.
      runbook: homelab-journey/docs/monitoring-phase5.md#slos
      summary: The API is burning its latency budget
      title: (ticket) {{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget
        burn rate is too fast.
