# Loki, single binary, filesystem storage (observability plan, Phase 1).
# Deployed verbatim by playbooks/services/monitoring-setup.yml. Validate with:
#   docker run --rm -v "$PWD/loki-config.yml:/etc/loki/config.yml:ro" grafana/loki:3.4.2 -config.file=/etc/loki/config.yml -verify-config
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

limits_config:
  # Request and application logs are kept 14 days; anything logged at level=error (5xx request
  # lines, exceptions with stacks) is kept 30 days. Selectors can only use labels, which is why
  # `level` is a label (a handful of values) and everything else stays a JSON field.
  retention_period: 336h
  retention_stream:
    - selector: '{level="error"}'
      priority: 1
      period: 720h
  # Guard rails for a 80 GB VM with 6 GB of RAM shared with Prometheus and Grafana.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 15MB
  max_label_names_per_series: 10
  max_entries_limit_per_query: 5000
  max_query_lookback: 720h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
