---
# Monitoring stack on the monitoring VM: Prometheus, Alertmanager (Telegram), blackbox-exporter,
# Loki (logs), Grafana, node-exporter.
# Observability plan: Phase 0 (alerts, probes, external heartbeat) and Phase 1 (logs, Requests dashboard).
#
# Required environment variables on the machine running ansible (see ansible/.env.example):
#   GRAFANA_ADMIN_PASSWORD   at least 12 characters of A-Z a-z 0-9 . _ @ % + = -   (never "admin")
#   TELEGRAM_BOT_TOKEN       bot used ONLY to send alerts (a dedicated bot is recommended)
#   TELEGRAM_OPS_CHAT_ID     numeric id of the ops group, e.g. -1001234567890
# Optional:
#   HEARTBEAT_URL            dead-man's-switch ping URL (e.g. a Healthchecks.io check). Without it
#                            the Watchdog alert goes nowhere and a homelab outage stays silent.
#   TELEGRAM_THREAD_CRITICAL / TELEGRAM_THREAD_WARNING   forum topic ids (0 or unset = no topic)
#
# Usage:
#   cd ansible && set -a && . ./.env && set +a
#   ansible-playbook playbooks/services/monitoring-setup.yml
#   ansible-playbook playbooks/services/monitoring-setup.yml -e send_test_alert=true   # one test message
- name: Setup Monitoring Stack (Prometheus, Alertmanager, Grafana) on monitoring VM
  hosts: monitoring
  become: yes
  gather_facts: yes

  vars:
    monitoring_dir: /opt/monitoring
    prometheus_version: "v2.48.1"
    alertmanager_version: "v0.28.1"      # telegram_configs with bot_token_file / message_thread_id
    blackbox_version: "v0.25.0"
    loki_version: "3.4.2"
    tempo_version: "2.8.2"               # single binary; traces kept 7 days (tempo-config.yml)
    grafana_version: "10.2.3"
    prometheus_port: 9090
    grafana_port: 3000
    prometheus_retention: "30d"
    # Keep Prometheus from filling the 80 GB VM disk even if series counts grow.
    prometheus_retention_size: "40GB"
    grafana_root_url: "https://grafana.tfdevs.com"
    send_test_alert: false

    # Secrets and settings come from the environment of the control machine, never from git.
    grafana_admin_password: "{{ lookup('ansible.builtin.env', 'GRAFANA_ADMIN_PASSWORD') }}"
    telegram_bot_token: "{{ lookup('ansible.builtin.env', 'TELEGRAM_BOT_TOKEN') }}"
    telegram_chat_id: "{{ lookup('ansible.builtin.env', 'TELEGRAM_OPS_CHAT_ID') }}"
    telegram_thread_critical: "{{ lookup('ansible.builtin.env', 'TELEGRAM_THREAD_CRITICAL') | default('0', true) }}"
    telegram_thread_warning: "{{ lookup('ansible.builtin.env', 'TELEGRAM_THREAD_WARNING') | default('0', true) }}"
    heartbeat_url: "{{ lookup('ansible.builtin.env', 'HEARTBEAT_URL') }}"
    # Origin of the site: alert messages get an "Open in control room" link to /admin/ops/alerts.
    # Defaults to production; set CONTROL_ROOM_URL to use another origin.
    control_room_url: "{{ lookup('ansible.builtin.env', 'CONTROL_ROOM_URL') | default('https://tfdevs.com', true) | regex_replace('/+$', '') }}"

    # ---- scrape and probe targets -------------------------------------------------------------
    k8s_node_targets:
      - 192.168.100.201
      - 192.168.100.202
      - 192.168.100.203
    # Alloy's own metrics (hostPort 12345 on the workers, and on the gateway VM): log-shipping alert.
    alloy_k8s_targets:
      - 192.168.100.202:12345
      - 192.168.100.203:12345
    alloy_gateway_targets:
      - 192.168.100.210:12345

    # Datastore exporters on database-vm (playbooks/services/database-exporters-setup.yml).
    mongodb_exporter_target: "192.168.100.205:9216"
    redis_exporter_target: "192.168.100.205:9121"
    # MinIO's own metrics. Needs a bearer token (docs/monitoring-phase3.md): without
    # MINIO_PROMETHEUS_TOKEN in the environment the MinIO job is left out.
    minio_metrics_target: "192.168.100.206:9000"
    minio_metrics_token: "{{ lookup('ansible.builtin.env', 'MINIO_PROMETHEUS_TOKEN') }}"

    # kube-state-metrics NodePort (kubernetes/kube-state-metrics-setup.yml). One node only.
    kube_state_metrics_target: "192.168.100.202:30686"

    # Public HTTPS probes. `severity` is attached to the series and inherited by the alert.
    blackbox_http_targets:
      - { url: "https://tfdevs.com",                probe: site,      env: prod, severity: critical }
      - { url: "https://api.tfdevs.com/health",     probe: api,       env: prod, severity: critical }
      - { url: "https://dev.tfdevs.com",            probe: site,      env: dev,  severity: warning }
      - { url: "https://api-dev.tfdevs.com/health", probe: api,       env: dev,  severity: warning }
      - { url: "https://plausible.tfdevs.com",      probe: plausible, env: prod, severity: warning }

    # TCP reachability. SSH on every VM tells you the VM is up; the service ports tell you the
    # service is up. Database ports are published by database-setup.yml.
    blackbox_tcp_targets:
      - { addr: "192.168.100.50:8006",  probe: proxmox-ui, name: proxmox-host,  severity: critical }
      - { addr: "192.168.100.201:22",   probe: ssh,        name: k8s-master,    severity: critical }
      - { addr: "192.168.100.202:22",   probe: ssh,        name: k8s-worker-1,  severity: critical }
      - { addr: "192.168.100.203:22",   probe: ssh,        name: k8s-worker-2,  severity: critical }
      - { addr: "192.168.100.205:22",   probe: ssh,        name: database-vm,   severity: critical }
      - { addr: "192.168.100.210:22",   probe: ssh,        name: app-gateway,   severity: critical }
      - { addr: "192.168.100.230:22",   probe: ssh,        name: n8n,           severity: warning }
      - { addr: "192.168.100.240:22",   probe: ssh,        name: ci-cd,         severity: warning }
      - { addr: "192.168.100.250:22",   probe: ssh,        name: ai-vm,         severity: warning }
      - { addr: "192.168.100.205:27017", probe: mongodb,    name: database-vm,   severity: critical }
      - { addr: "192.168.100.205:6379", probe: redis,      name: database-vm,   severity: critical }
      - { addr: "192.168.100.205:5432", probe: postgres,   name: database-vm,   severity: critical }
      - { addr: "192.168.100.210:80",   probe: npm-http,   name: app-gateway,   severity: critical }
      - { addr: "192.168.100.202:30389", probe: ingress-nodeport, name: k8s-worker-1, severity: critical }
      - { addr: "192.168.100.240:5000", probe: registry,   name: ci-cd,         severity: warning }

  pre_tasks:
    - name: Refuse to deploy without real credentials
      assert:
        that:
          - grafana_admin_password | length >= 12
          - grafana_admin_password is match('^[A-Za-z0-9._@%+=-]+$')
          - grafana_admin_password | lower != 'admin'
          - telegram_bot_token | length > 20
          - telegram_chat_id is match('^-?[0-9]+$')
          - telegram_thread_critical is match('^[0-9]+$')
          - telegram_thread_warning is match('^[0-9]+$')
        fail_msg: >-
          Set GRAFANA_ADMIN_PASSWORD (12+ chars from A-Z a-z 0-9 . _ @ % + = -, not "admin"),
          TELEGRAM_BOT_TOKEN and TELEGRAM_OPS_CHAT_ID (numeric) in the environment first.
          See ansible/.env.example and docs/monitoring-phase0.md.
        quiet: true
      no_log: true
      delegate_to: localhost
      become: no
      run_once: true

    - name: Warn when no external heartbeat is configured
      debug:
        msg: >-
          HEARTBEAT_URL is not set. Without it a power or ISP outage in the homelab produces
          silence, not an alert. See docs/monitoring-phase0.md section "External heartbeat".
      when: heartbeat_url | length == 0

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - docker-compose
          - python3-docker
        state: present

    - name: Create monitoring directory structure
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ monitoring_dir }}"
        - "{{ monitoring_dir }}/prometheus"
        - "{{ monitoring_dir }}/prometheus/data"
        - "{{ monitoring_dir }}/prometheus/alerts"
        - "{{ monitoring_dir }}/alertmanager"
        - "{{ monitoring_dir }}/alertmanager/templates"
        - "{{ monitoring_dir }}/blackbox"
        - "{{ monitoring_dir }}/loki"
        - "{{ monitoring_dir }}/tempo"
        - "{{ monitoring_dir }}/prometheus/secrets"
        - "{{ monitoring_dir }}/grafana"
        - "{{ monitoring_dir }}/grafana/data"
        - "{{ monitoring_dir }}/grafana/provisioning"
        - "{{ monitoring_dir }}/grafana/provisioning/datasources"
        - "{{ monitoring_dir }}/grafana/provisioning/dashboards"
        - "{{ monitoring_dir }}/grafana/dashboards"

    # ---- Alertmanager ------------------------------------------------------------------------
    - name: Create Alertmanager data and secrets directories (owned by nobody)
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "65534"
        group: "65534"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ monitoring_dir }}/alertmanager/data", mode: "0755" }
        - { path: "{{ monitoring_dir }}/alertmanager/secrets", mode: "0700" }

    - name: Write Telegram bot token (read from a file, never from the config)
      copy:
        content: "{{ telegram_bot_token }}"
        dest: "{{ monitoring_dir }}/alertmanager/secrets/telegram_token"
        owner: "65534"
        group: "65534"
        mode: "0400"
      no_log: true

    - name: Write heartbeat URL
      copy:
        content: "{{ heartbeat_url }}"
        dest: "{{ monitoring_dir }}/alertmanager/secrets/heartbeat_url"
        owner: "65534"
        group: "65534"
        mode: "0400"
      when: heartbeat_url | length > 0
      no_log: true

    - name: Remove a stale heartbeat URL when none is configured
      file:
        path: "{{ monitoring_dir }}/alertmanager/secrets/heartbeat_url"
        state: absent
      when: heartbeat_url | length == 0

    - name: Create Alertmanager configuration
      template:
        src: "{{ playbook_dir }}/templates/monitoring/alertmanager.yml.j2"
        dest: "{{ monitoring_dir }}/alertmanager/alertmanager.yml"
        mode: "0644"

    - name: Install Telegram message template
      copy:
        src: "{{ playbook_dir }}/files/monitoring/alertmanager/telegram.tmpl"
        dest: "{{ monitoring_dir }}/alertmanager/templates/telegram.tmpl"
        mode: "0644"

    # The one site-specific value in the messages, written as its own template so telegram.tmpl can
    # stay a verbatim copy (its {{ }} would clash with Jinja). Always defined, possibly empty.
    - name: Install the control room link for alert messages
      copy:
        content: |
          {% raw %}{{ define "tfd.controlroom.link" -}}{% endraw %}<a href="{{ control_room_url }}/admin/ops/alerts">Open in control room</a>{% raw %}{{- end }}{% endraw %}

        dest: "{{ monitoring_dir }}/alertmanager/templates/links.tmpl"
        mode: "0644"

    # ---- Loki --------------------------------------------------------------------------------
    - name: Create Loki data directory (the Loki image runs as uid 10001)
      file:
        path: "{{ monitoring_dir }}/loki/data"
        state: directory
        owner: "10001"
        group: "10001"
        mode: "0755"

    - name: Install Loki configuration
      copy:
        src: "{{ playbook_dir }}/files/monitoring/loki/loki-config.yml"
        dest: "{{ monitoring_dir }}/loki/loki-config.yml"
        mode: "0644"

    # ---- Tempo -------------------------------------------------------------------------------
    - name: Create Tempo data directory (the Tempo image runs as uid 10001)
      file:
        path: "{{ monitoring_dir }}/tempo/data"
        state: directory
        owner: "10001"
        group: "10001"
        mode: "0755"

    - name: Install Tempo configuration
      copy:
        src: "{{ playbook_dir }}/files/monitoring/tempo/tempo-config.yml"
        dest: "{{ monitoring_dir }}/tempo/tempo-config.yml"
        mode: "0644"

    # ---- MinIO metrics token (optional) --------------------------------------------------------
    - name: Write the MinIO metrics bearer token (read from a file, never from the config)
      copy:
        content: "{{ minio_metrics_token }}"
        dest: "{{ monitoring_dir }}/prometheus/secrets/minio_token"
        owner: "65534"
        group: "65534"
        mode: "0400"
      when: minio_metrics_token | length > 0
      no_log: true

    - name: Remove a stale MinIO metrics token when none is configured
      file:
        path: "{{ monitoring_dir }}/prometheus/secrets/minio_token"
        state: absent
      when: minio_metrics_token | length == 0

    # ---- blackbox-exporter -------------------------------------------------------------------
    - name: Install blackbox-exporter modules
      copy:
        src: "{{ playbook_dir }}/files/monitoring/blackbox/blackbox.yml"
        dest: "{{ monitoring_dir }}/blackbox/blackbox.yml"
        mode: "0644"

    # ---- Prometheus --------------------------------------------------------------------------
    - name: Create Prometheus configuration
      template:
        src: "{{ playbook_dir }}/templates/monitoring/prometheus.yml.j2"
        dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
        mode: "0644"

    - name: Install alert rules
      copy:
        src: "{{ playbook_dir }}/files/monitoring/prometheus/alerts/"
        dest: "{{ monitoring_dir }}/prometheus/alerts/"
        mode: "0644"

    # ---- Grafana -----------------------------------------------------------------------------
    - name: Create Grafana datasource configuration
      copy:
        dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/prometheus.yml"
        content: |
          apiVersion: 1

          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              uid: prometheus
              url: http://prometheus:9090
              isDefault: true
              editable: true
              jsonData:
                # The exemplar on a slow-request latency point links to its trace in Tempo.
                exemplarTraceIdDestinations:
                  - name: traceId
                    datasourceUid: tempo
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://loki:3100
              editable: true
              jsonData:
                maxLines: 1000
                # Turns every requestId in a log line into a link that opens all lines with that id.
                derivedFields:
                  - name: requestId
                    matcherRegex: '"requestId":"([A-Za-z0-9._-]+)"'
                    url: '{env=~".+"} |= "$${__value.raw}"'
                    datasourceUid: loki
                    urlDisplayLabel: All lines for this request
                  # ... and every traceId into a link that opens the trace in Tempo.
                  - name: traceId
                    matcherRegex: '"traceId":"([0-9a-f]{32})"'
                    url: '$${__value.raw}'
                    datasourceUid: tempo
                    urlDisplayLabel: Open the trace
            - name: Tempo
              type: tempo
              uid: tempo
              access: proxy
              url: http://tempo:3200
              editable: true
              jsonData:
                # Trace -> logs: the lines of the same trace id around the span's time.
                tracesToLogsV2:
                  datasourceUid: loki
                  spanStartTimeShift: '-5m'
                  spanEndTimeShift: '5m'
                  filterByTraceID: false
                  filterBySpanID: false
                  customQuery: true
                  query: '{env=~".+"} |= "$${__trace.traceId}"'
                # Trace -> metrics: request rate and latency of the span's service.
                tracesToMetrics:
                  datasourceUid: prometheus
                  spanStartTimeShift: '-5m'
                  spanEndTimeShift: '5m'
                  queries:
                    - name: Request rate
                      query: 'sum(rate(http_server_duration_seconds_count{app="$${__span.tags["service.name"]}"}[1m]))'
                serviceMap:
                  datasourceUid: prometheus
                nodeGraph:
                  enabled: true
            - name: Alertmanager
              type: alertmanager
              access: proxy
              url: http://alertmanager:9093
              editable: true
              jsonData:
                implementation: prometheus
        mode: "0644"

    - name: Create Grafana dashboard provisioning config
      copy:
        dest: "{{ monitoring_dir }}/grafana/provisioning/dashboards/default.yml"
        content: |
          apiVersion: 1

          providers:
            - name: 'Default'
              orgId: 1
              folder: ''
              type: file
              disableDeletion: false
              updateIntervalSeconds: 10
              allowUiUpdates: true
              options:
                path: /etc/grafana/provisioning/dashboards
        mode: "0644"

    - name: Install the dashboards
      copy:
        src: "{{ playbook_dir }}/files/monitoring/grafana/dashboards/{{ item }}"
        dest: "{{ monitoring_dir }}/grafana/provisioning/dashboards/{{ item }}"
        mode: "0644"
      loop:
        - tfd-requests.json
        - tfd-services.json
        - tfd-datastores.json

    - name: Write Grafana environment file (admin password lives here, not in docker-compose.yml)
      copy:
        dest: "{{ monitoring_dir }}/grafana.env"
        content: |
          GF_SECURITY_ADMIN_USER=admin
          GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}
        owner: root
        group: root
        mode: "0600"
      no_log: true

    # ---- Compose -----------------------------------------------------------------------------
    - name: Create Docker Compose file
      copy:
        dest: "{{ monitoring_dir }}/docker-compose.yml"
        content: |
          version: '3.8'

          services:
            prometheus:
              image: prom/prometheus:{{ prometheus_version }}
              container_name: prometheus
              restart: unless-stopped
              command:
                - '--config.file=/etc/prometheus/prometheus.yml'
                - '--storage.tsdb.path=/prometheus'
                - '--storage.tsdb.retention.time={{ prometheus_retention }}'
                - '--storage.tsdb.retention.size={{ prometheus_retention_size }}'
                - '--web.console.libraries=/usr/share/prometheus/console_libraries'
                - '--web.console.templates=/usr/share/prometheus/consoles'
                - '--web.enable-lifecycle'
                # Phase 3: Alloy (K3s) and Tempo write metrics here; slow-request trace ids are kept as exemplars.
                - '--web.enable-remote-write-receiver'
                - '--enable-feature=exemplar-storage'
              ports:
                - "{{ prometheus_port }}:9090"
              volumes:
                - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - ./prometheus/alerts:/etc/prometheus/alerts:ro
                - ./prometheus/secrets:/etc/prometheus/secrets:ro
                - ./prometheus/data:/prometheus
              networks:
                - monitoring
              depends_on:
                - alertmanager
                - blackbox-exporter

            alertmanager:
              image: prom/alertmanager:{{ alertmanager_version }}
              container_name: alertmanager
              restart: unless-stopped
              command:
                - '--config.file=/etc/alertmanager/alertmanager.yml'
                - '--storage.path=/alertmanager'
                - '--web.external-url=http://192.168.100.220:9093'
              ports:
                # On the LAN, like Prometheus and Loki, so the API pods can list alerts and create
                # silences for the control room (/admin/ops, Phase 4). Unauthenticated: it must stay
                # off the tunnel and the gateway (see docs/monitoring-phase4.md).
                - "9093:9093"
              volumes:
                - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
                - ./alertmanager/templates:/etc/alertmanager/templates:ro
                - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
                - ./alertmanager/data:/alertmanager
              networks:
                - monitoring

            blackbox-exporter:
              image: prom/blackbox-exporter:{{ blackbox_version }}
              container_name: blackbox-exporter
              restart: unless-stopped
              command:
                - '--config.file=/etc/blackbox/blackbox.yml'
              ports:
                - "127.0.0.1:9115:9115"
              volumes:
                - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
              networks:
                - monitoring

            loki:
              image: grafana/loki:{{ loki_version }}
              container_name: loki
              restart: unless-stopped
              command:
                - '-config.file=/etc/loki/config.yml'
              environment:
                # Soft memory ceiling: the VM has 6 GB shared with Prometheus and Grafana.
                - GOMEMLIMIT=768MiB
              ports:
                # LAN: Alloy on the K3s workers and on the gateway VM pushes here. No auth, keep it on the LAN.
                - "3100:3100"
              volumes:
                - ./loki/loki-config.yml:/etc/loki/config.yml:ro
                - ./loki/data:/loki
              networks:
                - monitoring

            tempo:
              image: grafana/tempo:{{ tempo_version }}
              container_name: tempo
              restart: unless-stopped
              command:
                - '-config.file=/etc/tempo/config.yml'
              environment:
                # Soft memory ceiling: the VM has 6 GB shared with Prometheus, Loki and Grafana.
                - GOMEMLIMIT=512MiB
              ports:
                # LAN: the trace collector in K3s sends OTLP/gRPC to 4317 and the playbooks check 3200.
                # No auth, keep both on the LAN; Grafana reads through the compose network.
                - "4317:4317"
                - "3200:3200"
              volumes:
                - ./tempo/tempo-config.yml:/etc/tempo/config.yml:ro
                - ./tempo/data:/var/tempo
              networks:
                - monitoring

            grafana:
              image: grafana/grafana:{{ grafana_version }}
              container_name: grafana
              restart: unless-stopped
              ports:
                - "{{ grafana_port }}:3000"
              env_file:
                - ./grafana.env
              environment:
                - GF_INSTALL_PLUGINS=grafana-piechart-panel
                - GF_SERVER_ROOT_URL={{ grafana_root_url }}
                - GF_USERS_ALLOW_SIGN_UP=false
                - GF_AUTH_ANONYMOUS_ENABLED=false
                - GF_ANALYTICS_REPORTING_ENABLED=false
                - GF_ANALYTICS_CHECK_FOR_UPDATES=false
              volumes:
                - ./grafana/data:/var/lib/grafana
                - ./grafana/dashboards:/var/lib/grafana/dashboards
                - ./grafana/provisioning:/etc/grafana/provisioning
              networks:
                - monitoring
              depends_on:
                - prometheus
                - loki

            node-exporter:
              image: prom/node-exporter:latest
              container_name: node-exporter
              restart: unless-stopped
              command:
                - '--path.procfs=/host/proc'
                - '--path.sysfs=/host/sys'
                - '--path.rootfs=/host'
                - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
              ports:
                - "9100:9100"
              volumes:
                - /proc:/host/proc:ro
                - /sys:/host/sys:ro
                - /:/host:ro,rslave
              networks:
                - monitoring

          networks:
            monitoring:
              driver: bridge
        mode: "0644"

    - name: Set proper permissions for data directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "65534" # nobody user for prometheus
        group: "65534"
        recurse: yes
      loop:
        - "{{ monitoring_dir }}/prometheus/data"
        - "{{ monitoring_dir }}/alertmanager/data"

    - name: Set Grafana data directory permissions
      file:
        path: "{{ monitoring_dir }}/grafana/data"
        state: directory
        owner: "472" # grafana user
        group: "472"
        recurse: yes

    # ---- Validate BEFORE touching the running stack ------------------------------------------
    - name: Validate Prometheus configuration and alert rules (promtool)
      command: >-
        docker run --rm --entrypoint promtool
        -v {{ monitoring_dir }}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        -v {{ monitoring_dir }}/prometheus/alerts:/etc/prometheus/alerts:ro
        prom/prometheus:{{ prometheus_version }}
        check config /etc/prometheus/prometheus.yml
      changed_when: false

    - name: Validate Alertmanager configuration and templates (amtool)
      command: >-
        docker run --rm --entrypoint amtool
        -v {{ monitoring_dir }}/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
        -v {{ monitoring_dir }}/alertmanager/templates:/etc/alertmanager/templates:ro
        -v {{ monitoring_dir }}/alertmanager/secrets:/etc/alertmanager/secrets:ro
        prom/alertmanager:{{ alertmanager_version }}
        check-config /etc/alertmanager/alertmanager.yml
      changed_when: false

    - name: Validate Loki configuration
      command: >-
        docker run --rm
        -v {{ monitoring_dir }}/loki/loki-config.yml:/etc/loki/config.yml:ro
        grafana/loki:{{ loki_version }}
        -config.file=/etc/loki/config.yml -verify-config
      changed_when: false

    - name: Validate Tempo configuration
      command: >-
        docker run --rm
        -v {{ monitoring_dir }}/tempo/tempo-config.yml:/etc/tempo/config.yml:ro
        grafana/tempo:{{ tempo_version }}
        -config.file=/etc/tempo/config.yml -config.verify=true
      changed_when: false

    - name: Validate Docker Compose file
      command: docker-compose config -q
      args:
        chdir: "{{ monitoring_dir }}"
      changed_when: false

    # ---- (Re)start ---------------------------------------------------------------------------
    - name: Check if monitoring stack is running
      shell: docker ps --filter "name=prometheus" --format {% raw %}"{{.Names}}"{% endraw %}
      register: monitoring_running
      changed_when: false
      failed_when: false

    - name: Stop monitoring stack if running (for updates)
      shell: docker-compose down
      args:
        chdir: "{{ monitoring_dir }}"
      when: monitoring_running.stdout | length > 0
      ignore_errors: yes

    - name: Start monitoring stack with Docker Compose
      shell: docker-compose up -d
      args:
        chdir: "{{ monitoring_dir }}"

    - name: Wait for Prometheus to be ready
      uri:
        url: "http://localhost:{{ prometheus_port }}/-/ready"
        status_code: 200
      register: prometheus_status
      until: prometheus_status.status == 200
      retries: 10
      delay: 5

    - name: Wait for Alertmanager to be ready
      uri:
        url: "http://localhost:9093/-/ready"
        status_code: 200
      register: alertmanager_status
      until: alertmanager_status.status == 200
      retries: 10
      delay: 5

    - name: Wait for Loki to be ready
      uri:
        url: "http://localhost:3100/ready"
        status_code: 200
      register: loki_status
      until: loki_status.status == 200
      retries: 20
      delay: 6

    - name: Wait for Tempo to be ready
      uri:
        url: "http://localhost:3200/ready"
        status_code: 200
      register: tempo_status
      until: tempo_status.status == 200
      retries: 20
      delay: 6

    - name: Wait for blackbox-exporter to be ready
      uri:
        url: "http://localhost:9115/metrics"
        status_code: 200
      register: blackbox_status
      until: blackbox_status.status == 200
      retries: 10
      delay: 5

    - name: Wait for Grafana to be ready
      uri:
        url: "http://localhost:{{ grafana_port }}/api/health"
        status_code: 200
      register: grafana_status
      until: grafana_status.status == 200
      retries: 10
      delay: 5

    # GF_SECURITY_ADMIN_PASSWORD only applies when Grafana first creates its database. On a VM
    # that already ran with admin/admin the stored password would stay. Reset it explicitly.
    - name: Apply the Grafana admin password to an existing database
      command: docker exec -i grafana grafana cli admin reset-admin-password --password-from-stdin
      args:
        stdin: "{{ grafana_admin_password }}"
      register: grafana_pw_reset
      failed_when: false
      changed_when: false
      no_log: true

    - name: Explain a failed Grafana password reset
      debug:
        msg:
          - "Could not reset the Grafana admin password automatically (this Grafana build may not support --password-from-stdin)."
          - "Do it by hand, then re-run: ssh to the VM and run"
          - "  docker exec -it grafana grafana cli admin reset-admin-password '<new password>'"
          - "Until then Grafana may still accept the OLD password."
      when: grafana_pw_reset.rc != 0

    - name: Reload Prometheus to be sure rules and targets are current
      uri:
        url: "http://localhost:{{ prometheus_port }}/-/reload"
        method: POST
        status_code: 200

    - name: Read loaded alert rule groups
      uri:
        url: "http://localhost:{{ prometheus_port }}/api/v1/rules"
        return_content: yes
      register: loaded_rules
      changed_when: false

    - name: Check that the alert rules were loaded
      assert:
        that:
          - loaded_rules.json.data.groups | length >= 5
        fail_msg: "Prometheus loaded fewer than 5 rule groups. Check /rules and the promtool output above."
        quiet: true

    - name: Send one test alert to Telegram
      uri:
        url: "http://localhost:9093/api/v2/alerts"
        method: POST
        body_format: json
        body:
          - labels:
              alertname: PhaseZeroTest
              severity: warning
              instance: monitoring-vm
            annotations:
              summary: "Test alert from monitoring-setup.yml"
              description: "If you can read this in the ops group, the Alertmanager to Telegram path works."
            endsAt: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime((ansible_date_time.epoch | int) + 300, utc=true) }}"
        status_code: 200
      when: send_test_alert | bool

    - name: Get container status
      shell: docker-compose ps
      args:
        chdir: "{{ monitoring_dir }}"
      register: containers_status
      changed_when: false

    - name: Display monitoring URLs
      debug:
        msg:
          - "===== Monitoring Stack Deployed Successfully ====="
          - ""
          - "Prometheus:    http://192.168.100.220:{{ prometheus_port }}  (targets: /targets, rules: /rules, alerts: /alerts)"
          - "Alertmanager:  http://127.0.0.1:9093 on the VM (loopback only; reach it through Grafana)"
          - "Loki:          http://192.168.100.220:3100 (LAN; ingestion by Alloy, query through Grafana)"
          - "Tempo:         http://192.168.100.220:3200 and OTLP gRPC :4317 (LAN; fed by the alloy-traces collector, query through Grafana)"
          - "Grafana:       http://192.168.100.220:{{ grafana_port }} and {{ grafana_root_url }} once tfdevs-infra is applied"
          - "                user: admin, password: the value of GRAFANA_ADMIN_PASSWORD"
          - "Heartbeat:     {{ 'configured' if heartbeat_url | length > 0 else 'NOT configured, outages will be silent' }}"
          - ""
          - "Next:"
          - "  1. ansible-playbook playbooks/kubernetes/kube-state-metrics-setup.yml  (if not done)"
          - "  2. ansible-playbook playbooks/services/node-exporter-setup.yml         (if k8s-nodes targets are down)"
          - "  3. Re-run with -e send_test_alert=true to confirm Telegram delivery"
          - "  4. docs/monitoring-phase0.md: verification steps"
          - "  5. Logs (Phase 1): playbooks/kubernetes/alloy-setup.yml, playbooks/networking/gateway-logging-setup.yml, then docs/monitoring-phase1.md"
          - "  6. Metrics and traces (Phase 3): playbooks/services/database-exporters-setup.yml, playbooks/kubernetes/alloy-setup.yml (again), then docs/monitoring-phase3.md"
          - ""
          - "Container Status:"
          - "{{ containers_status.stdout_lines }}"
          - ""
          - "To manage the stack:"
          - "  cd {{ monitoring_dir }}"
          - "  docker-compose logs -f        # View logs"
          - "  docker-compose restart        # Restart all"
          - "  docker-compose down           # Stop all"
          - "  docker-compose up -d          # Start all"
