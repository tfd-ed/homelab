---
- name: Setup Database Server
  hosts: database-vm
  become: yes
  vars:
    postgres_version: "16"
    mysql_version: "8.4"
    mongo_version: "8.2"
    redis_version: "8.2.1"
    minio_version: "latest"
    # Default passwords - CHANGE THESE IN PRODUCTION
    postgres_password: "{{ lookup('ansible.builtin.env', 'POSTGRES_PASSWORD') |
      default('changeme_postgres', true) }}"
    mysql_root_password:
      "{{ lookup('ansible.builtin.env', 'MYSQL_ROOT_PASSWORD') |
      default('changeme_mysql', true) }}"
    mongo_root_password:
      "{{ lookup('ansible.builtin.env', 'MONGO_ROOT_PASSWORD') |
      default('changeme_mongo', true) }}"
    redis_password: "{{ lookup('ansible.builtin.env', 'REDIS_PASSWORD') |
      default('changeme_redis', true) }}"
    minio_root_user: "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_USER') |
      default('minioadmin', true) }}"
    minio_root_password:
      "{{ lookup('ansible.builtin.env', 'MINIO_ROOT_PASSWORD') |
      default('changeme_minio', true) }}"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
          - python3-pip
          - postgresql-client
        state: present

    - name: Create database directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/databases
        - /opt/databases/postgres/data
        - /opt/databases/mysql/data
        - /opt/databases/mongo/data
        - /opt/databases/redis/data
        - /opt/databases/minio/data
        - /opt/databases/backups

    - name: Create Docker network for databases
      docker_network:
        name: db_network
        driver: bridge
        state: present

    - name: Deploy PostgreSQL container
      docker_container:
        name: postgres
        image: "postgres:{{ postgres_version }}-alpine"
        state: started
        restart_policy: unless-stopped
        ports:
          - "5432:5432"
        env:
          POSTGRES_PASSWORD: "{{ postgres_password }}"
          POSTGRES_USER: "postgres"
          PGDATA: "/var/lib/postgresql/data/pgdata"
        volumes:
          - /opt/databases/postgres/data:/var/lib/postgresql/data
        networks:
          - name: db_network
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U postgres"]
          interval: 10s
          timeout: 5s
          retries: 5

    - name: Deploy MySQL container
      docker_container:
        name: mysql
        image: "mysql:{{ mysql_version }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "3306:3306"
        env:
          MYSQL_ROOT_PASSWORD: "{{ mysql_root_password }}"
        volumes:
          - /opt/databases/mysql/data:/var/lib/mysql
        networks:
          - name: db_network
        healthcheck:
          test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
          interval: 10s
          timeout: 5s
          retries: 5

    - name: Deploy MongoDB container
      docker_container:
        name: mongodb
        image: "mongo:{{ mongo_version }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "27017:27017"
        env:
          MONGO_INITDB_ROOT_USERNAME: "admin"
          MONGO_INITDB_ROOT_PASSWORD: "{{ mongo_root_password }}"
        volumes:
          - /opt/databases/mongo/data:/data/db
        networks:
          - name: db_network
        healthcheck:
          test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
          interval: 10s
          timeout: 5s
          retries: 5

    - name: Deploy Redis container
      docker_container:
        name: redis
        image: "redis:{{ redis_version }}-alpine"
        state: started
        restart_policy: unless-stopped
        ports:
          - "6379:6379"
        command: >
          redis-server --requirepass {{ redis_password }} --appendonly yes
          --appendfsync everysec
        volumes:
          - /opt/databases/redis/data:/data
        networks:
          - name: db_network
        healthcheck:
          test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
          interval: 10s
          timeout: 5s
          retries: 5

    - name: Deploy MinIO container
      docker_container:
        name: minio
        image: "minio/minio:{{ minio_version }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "9000:9000"
          - "9001:9001"
        env:
          MINIO_ROOT_USER: "{{ minio_root_user }}"
          MINIO_ROOT_PASSWORD: "{{ minio_root_password }}"
        command: server /data --console-address ":9001"
        volumes:
          - /opt/databases/minio/data:/data
        networks:
          - name: db_network
        healthcheck:
          test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
          interval: 30s
          timeout: 20s
          retries: 3

    - name: Deploy PostgreSQL Exporter container
      docker_container:
        name: postgres-exporter
        image: "prometheuscommunity/postgres-exporter:latest"
        state: started
        restart_policy: unless-stopped
        ports:
          - "9187:9187"
        env:
          DATA_SOURCE_NAME: "postgresql://postgres:{{ postgres_password }}@postgres:5432/postgres?sslmode=disable"
        networks:
          - name: db_network
        healthcheck:
          test:
            [
              "CMD",
              "wget",
              "--quiet",
              "--tries=1",
              "--spider",
              "http://localhost:9187/metrics",
            ]
          interval: 30s
          timeout: 10s
          retries: 3

    # Where the backup script leaves its result for node-exporter's textfile collector
    # (database-exporters-setup.yml mounts this directory; alerts/backup.yml reads the metrics).
    - name: Create the node-exporter textfile directory
      file:
        path: /var/lib/node_exporter/textfile_collector
        state: directory
        mode: "0755"

    # Observability plan, Phase 5.1.3. Each job is judged on its own: a job counts as a success only
    # when the command succeeded (pipefail, so a failing dump behind `| gzip` is not hidden) and the
    # file it wrote is not empty. A failed job's file is removed, so a truncated dump never sits
    # among the backups looking valid. The time and size of the last success of each job are kept in
    # backups/.state/<job> and published as metrics after every run (alerts/backup.yml).
    # NOTE: do not write a Jinja comment opener (brace plus hash) in this script, Ansible would
    # swallow it. Bash array length expressions contain exactly that.
    - name: Create backup script
      copy:
        dest: /opt/databases/backup.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Database Backup Script (managed by playbooks/services/database-setup.yml)
          set -u
          set -o pipefail
          umask 022

          BACKUP_DIR="/opt/databases/backups"
          STATE_DIR="${BACKUP_DIR}/.state"
          TEXTFILE_DIR="/var/lib/node_exporter/textfile_collector"
          DATE=$(date +%Y%m%d_%H%M%S)
          JOBS="postgres mysql mongodb redis minio"
          mkdir -p "${STATE_DIR}" "${TEXTFILE_DIR}"

          declare -A RUN_OK
          FAILED=0

          # job <name> <output file> <function>: the function writes the output file.
          job() {
            local name="$1" file="$2" fn="$3"
            if "$fn" "$file" && [ -s "$file" ]; then
              printf '%s %s\n' "$(date +%s)" "$(stat -c %s "$file")" > "${STATE_DIR}/${name}"
              RUN_OK[$name]=1
            else
              echo "Backup job ${name} FAILED" >&2
              rm -f "$file"
              RUN_OK[$name]=0
              FAILED=1
            fi
          }

          backup_postgres() {
            docker exec postgres pg_dumpall -U postgres | gzip > "$1"
          }

          backup_mysql() {
            docker exec mysql mysqldump -u root -p{{ mysql_root_password }} --all-databases | gzip > "$1"
          }

          backup_mongodb() {
            local tmp="${BACKUP_DIR}/mongodb_${DATE}" rc
            docker exec mongodb mongodump --username admin --password {{ mongo_root_password }} --authenticationDatabase admin --out=/tmp/backup \
              && docker cp mongodb:/tmp/backup "$tmp" \
              && tar -czf "$1" -C "${BACKUP_DIR}" "mongodb_${DATE}"
            rc=$?
            docker exec mongodb rm -rf /tmp/backup
            rm -rf "$tmp"
            return $rc
          }

          # BGSAVE returns at once; wait until Redis says the snapshot is finished, then copy it out.
          backup_redis() {
            local i
            docker exec redis redis-cli -a {{ redis_password }} --no-auth-warning BGSAVE > /dev/null || return 1
            for i in $(seq 1 30); do
              sleep 2
              docker exec redis redis-cli -a {{ redis_password }} --no-auth-warning INFO persistence | grep -q 'rdb_bgsave_in_progress:0' && break
            done
            docker exec redis redis-cli -a {{ redis_password }} --no-auth-warning INFO persistence | grep -q 'rdb_last_bgsave_status:ok' || return 1
            docker cp redis:/data/dump.rdb "$1"
          }

          # MinIO Backup (metadata and config)
          backup_minio() {
            tar -czf "$1" -C /opt/databases/minio/data .minio.sys
          }

          job postgres "${BACKUP_DIR}/postgres_${DATE}.sql.gz" backup_postgres
          job mysql    "${BACKUP_DIR}/mysql_${DATE}.sql.gz"    backup_mysql
          job mongodb  "${BACKUP_DIR}/mongodb_${DATE}.tar.gz"  backup_mongodb
          job redis    "${BACKUP_DIR}/redis_${DATE}.rdb"       backup_redis
          job minio    "${BACKUP_DIR}/minio_${DATE}.tar.gz"    backup_minio

          # Keep only last 7 days of backups (never the state files)
          find "${BACKUP_DIR}" -type f -mtime +7 -not -path "${STATE_DIR}/*" -delete

          # Publish the result for node-exporter (written aside and renamed, so a scrape never sees half a file).
          TMP="${TEXTFILE_DIR}/.db_backup.prom.$$"
          {
            echo '# HELP backup_last_success_timestamp_seconds Unix time of the last backup job that produced a non-empty file.'
            echo '# TYPE backup_last_success_timestamp_seconds gauge'
            for name in $JOBS; do
              if [ -f "${STATE_DIR}/${name}" ]; then
                read -r ts size < "${STATE_DIR}/${name}"
                echo "backup_last_success_timestamp_seconds{backup=\"${name}\"} ${ts}"
              fi
            done
            echo '# HELP backup_last_size_bytes Size of the file written by the last successful run of each backup job.'
            echo '# TYPE backup_last_size_bytes gauge'
            for name in $JOBS; do
              if [ -f "${STATE_DIR}/${name}" ]; then
                read -r ts size < "${STATE_DIR}/${name}"
                echo "backup_last_size_bytes{backup=\"${name}\"} ${size}"
              fi
            done
            echo '# HELP backup_last_run_success 1 when the most recent run of the job succeeded, 0 when it failed.'
            echo '# TYPE backup_last_run_success gauge'
            for name in $JOBS; do
              echo "backup_last_run_success{backup=\"${name}\"} ${RUN_OK[$name]:-0}"
            done
            echo '# HELP backup_last_run_timestamp_seconds Unix time the backup script last finished.'
            echo '# TYPE backup_last_run_timestamp_seconds gauge'
            echo "backup_last_run_timestamp_seconds $(date +%s)"
          } > "${TMP}" && mv "${TMP}" "${TEXTFILE_DIR}/db_backup.prom"

          if [ "${FAILED}" -ne 0 ]; then
            echo "Backup finished WITH FAILURES: ${DATE}" >&2
            exit 1
          fi
          echo "Backup completed: ${DATE}"

    - name: Setup daily backup cron job
      cron:
        name: "Database daily backup"
        minute: "0"
        hour: "2"
        job: "/opt/databases/backup.sh >> /var/log/db-backup.log 2>&1"
        state: present

    # NOTE: the UFW rules below protect nothing. The databases run in Docker with published ports,
    # which are NATed through FORWARD and never reach UFW's INPUT rules (and UFW is inactive on this
    # VM, so they are skipped anyway). Who may reach the ports is enforced by
    # playbooks/networking/database-firewall.yml (DOCKER-USER chain).
    - name: Configure UFW - Allow PostgreSQL
      ufw:
        rule: allow
        port: "5432"
        proto: tcp
        comment: "PostgreSQL"
      when: ansible_facts.services['ufw'] is defined

    - name: Configure UFW - Allow MySQL
      ufw:
        rule: allow
        port: "3306"
        proto: tcp
        comment: "MySQL"
      when: ansible_facts.services['ufw'] is defined

    - name: Configure UFW - Allow MongoDB
      ufw:
        rule: allow
        port: "27017"
        proto: tcp
        comment: "MongoDB"
      when: ansible_facts.services['ufw'] is defined

    - name: Configure UFW - Allow Redis
      ufw:
        rule: allow
        port: "6379"
        proto: tcp
        comment: "Redis"
      when: ansible_facts.services['ufw'] is defined

    - name: Configure UFW - Allow MinIO API
      ufw:
        rule: allow
        port: "9000"
        proto: tcp
        comment: "MinIO API"
      when: ansible_facts.services['ufw'] is defined

    - name: Configure UFW - Allow MinIO Console
      ufw:
        rule: allow
        port: "9001"
        proto: tcp
        comment: "MinIO Console"
      when: ansible_facts.services['ufw'] is defined

    - name: Display database connection information
      debug:
        msg:
          - "==================================================="
          - "Database Server Setup Complete!"
          - "==================================================="
          - "PostgreSQL: {{ ansible_host }}:5432"
          - "  User: postgres"
          - "  Password: {{ postgres_password }}"
          - ""
          - "MySQL: {{ ansible_host }}:3306"
          - "  User: root"
          - "  Password: {{ mysql_root_password }}"
          - ""
          - "MongoDB: {{ ansible_host }}:27017"
          - "  User: admin"
          - "  Password: {{ mongo_root_password }}"
          - ""
          - "Redis: {{ ansible_host }}:6379"
          - "  Password: {{ redis_password }}"
          - ""
          - "MinIO S3: {{ ansible_host }}:9000"
          - "MinIO Console: http://{{ ansible_host }}:9001"
          - "  User: {{ minio_root_user }}"
          - "  Password: {{ minio_root_password }}"
          - ""
          - "⚠️  IMPORTANT: Change default passwords in production!"
          - "⚠️  Set environment variables before running:"
          - "   export POSTGRES_PASSWORD=your_secure_password"
          - "   export MYSQL_ROOT_PASSWORD=your_secure_password"
          - "   export MONGO_ROOT_PASSWORD=your_secure_password"
          - "   export REDIS_PASSWORD=your_secure_password"
          - "   export MINIO_ROOT_USER=your_admin_username"
          - "   export MINIO_ROOT_PASSWORD=your_secure_password"
          - "==================================================="
